services:
  - type: web
    name: cyfrosearch-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    envVars:
      - key: ES_HOST
        sync: false
      - key: ES_USER
        sync: false
      - key: ES_PASSWORD
        sync: false
      - key: ES_INDEX
        value: products
    healthCheckPath: /api/health
