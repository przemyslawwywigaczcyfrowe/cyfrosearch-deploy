name: Reindex products + refresh GA4 popularity

on:
  workflow_dispatch:
    inputs:
      skip_ga4:
        description: "Skip GA4 popularity refresh"
        type: boolean
        default: false
  # Daily 04:00 UTC refresh (matches spec recommendation)
  schedule:
    - cron: "0 4 * * *"

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run indexer (fetch feed, recreate index with mapping, bulk load)
        env:
          ELASTIC_URL: ${{ secrets.ES_HOST }}
          ELASTIC_API_KEY: ${{ secrets.ES_API_KEY }}
        run: python indexer.py

      - name: Refresh GA4 popularity_score
        if: ${{ !inputs.skip_ga4 }}
        env:
          ELASTIC_URL: ${{ secrets.ES_HOST }}
          ELASTIC_API_KEY: ${{ secrets.ES_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SA_JSON }}
        run: |
          if [ -z "$GA4_PROPERTY_ID" ] || [ -z "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GA4 secrets missing — skipping popularity refresh"
            exit 0
          fi
          python ga_updater.py
