name: Index products to Elasticsearch

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Delete index first (wipes data, rebuilds mapping)"
        type: boolean
        default: false
      es_index:
        description: "Target index name"
        type: string
        default: "products"

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: indexer/requirements.txt

      - name: Install indexer deps
        run: pip install -r indexer/requirements.txt

      - name: Run indexer
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_API_KEY: ${{ secrets.ES_API_KEY }}
          ES_INDEX: ${{ inputs.es_index }}
          RECREATE: ${{ inputs.recreate }}
        run: python indexer/index_products.py
